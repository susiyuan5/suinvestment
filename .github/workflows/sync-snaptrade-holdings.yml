name: Sync encrypted Wealthsimple holdings
concurrency:
  group: snaptrade-holdings-sync
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SNAPTRADE_CLIENT_ID: ${{ secrets.SNAPTRADE_CLIENT_ID }}
      SNAPTRADE_CONSUMER_KEY: ${{ secrets.SNAPTRADE_CONSUMER_KEY }}
      HOLDINGS_SNAPSHOT_KEY: ${{ secrets.HOLDINGS_SNAPSHOT_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Generate, validate and publish independent data
        run: python scripts/live_data.py --task sync-snaptrade-holdings --review
      - name: Independent data read smoke (no Pages deployment)
        run: node scripts/live-data-smoke.mjs
"on":
  schedule:
    - cron: 30 6 * * *
  workflow_dispatch: null
