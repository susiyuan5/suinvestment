name: Update Idea Engine v3.1 Short-term Shadow
permissions:
  contents: write
  actions: read
  pull-requests: write
concurrency:
  group: update-idea-engine-v3-1
  cancel-in-progress: true
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    env:
      SEC_USER_AGENT: SuInvestment susiyuan0807@gmail.com
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Generate, validate and publish independent data
        run: python scripts/live_data.py --task update-idea-engine
      - name: Independent data read smoke (no Pages deployment)
        run: node scripts/live-data-smoke.mjs
"on":
  schedule:
    - cron: 30 14 * * 1
  workflow_dispatch: null
