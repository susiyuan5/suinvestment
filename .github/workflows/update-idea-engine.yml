name: Update Idea Engine Shadow

on:
  schedule:
    - cron: "30 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate manifest and run safe Shadow freeze
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("research/idea_engine/providers/provider_manifest.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["manifest_version"] == "1"
          assert all(item.get("code_executed") is False for item in payload["providers"])
          print("provider_manifest_valid=true")
          PY
          python -m research.idea_engine.run_idea_engine --output research/results/v2/idea-engine
      - name: Run contract tests
        run: python -m unittest discover -s tests
      - name: Create draft research PR when changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- research/results/v2/idea-engine; then
            echo "无变更"
            exit 0
          fi
          branch="automation/idea-engine-shadow-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/v2/idea-engine
          git commit -m "Update Idea Engine Shadow results"
          git push --set-upstream origin "$branch"
          gh pr create --draft --base main --head "$branch" --title "Update Idea Engine Shadow results" --body "仅更新 Shadow 研究结果；不影响本周定投，不自动交易。"
