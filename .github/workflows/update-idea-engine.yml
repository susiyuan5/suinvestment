name: Update Idea Engine v3 Shadow

on:
  schedule:
    - cron: "30 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-idea-engine-v3
  cancel-in-progress: true

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEC_USER_AGENT: SuInvestment susiyuan0807@gmail.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate pinned provider manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("research/idea_engine/providers/provider_manifest.json").read_text(encoding="utf-8"))
          assert payload["manifest_version"] == "1"
          assert all(item.get("name") and item.get("allowed_use") for item in payload["providers"])
          assert any(item.get("name") == "sec-edgar-public-data" and not item.get("api_key_required") for item in payload["providers"])
          print("provider_manifest_valid=true")
          PY

      - name: Generate isolated v3 candidates from free public data
        env:
          PYTHONPATH: .
        run: python -m research.idea_engine.v3.run_idea_engine_v3 --provider free --output research/results/v3/idea-engine

      - name: Build same-origin research price fallback
        run: python scripts/build_idea_price_trends.py

      - name: Run complete quality checks
        run: |
          python -m pip install "pandas>=2,<3"
          python -m unittest discover -s tests
          node --test tests/*.test.js
          python scripts/check_static_contracts.py

      - name: Create draft research pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-idea-engine-shadow
          delete-branch: true
          commit-message: "Update Idea Engine Shadow results"
          title: "Update Idea Engine Shadow results"
          draft: true
          body: |
            仅更新潜力股 Shadow 研究结果。

            - 不影响本周定投
            - 不连接券商
            - 不自动交易
            - 候选结果仅可人工复核
            - 数据源为免费 SEC EDGAR 与公开价格数据，无需付费 API Key
          add-paths: |
            research/results/v3/idea-engine/**
            data/idea-engine-v3/price-trends.json
