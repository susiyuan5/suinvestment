name: Update monthly shadow observation
permissions:
  contents: write
  actions: read
  pull-requests: write
concurrency:
  group: update-monthly-shadow-observation
  cancel-in-progress: true
jobs:
  update-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Generate, validate and publish independent data
        run: python scripts/live_data.py --task update-shadow-observation
      - name: Independent data read smoke (no Pages deployment)
        run: node scripts/live-data-smoke.mjs
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
"on":
  schedule:
    - cron: 15 13 1 * *
  workflow_dispatch: null
