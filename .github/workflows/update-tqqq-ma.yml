name: Update TQQQ moving-average daily closes
permissions:
  contents: write
  actions: read
concurrency:
  group: update-tqqq-ma
  cancel-in-progress: true
jobs:
  update-tqqq-ma:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Generate, validate and publish SPY and QQQ daily snapshot
        run: python scripts/live_data.py --task update-tqqq-ma
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
"on":
  schedule:
    # US sessions close 16:00 New York (20:00 or 21:00 UTC); refresh after the close and retry later.
    - cron: 47 21 * * 1-5
    - cron: 47 23 * * 1-5
  workflow_dispatch: null
